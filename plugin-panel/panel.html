<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Halo</title><style>
:root{font-family:var(--font-sans,Segoe UI,system-ui,sans-serif);color-scheme:light dark;--fg:#192335;--bg:#f7f9fc;--card:rgba(255,255,255,.76);--muted:#69778c;color:var(--fg);background:var(--bg)}
:root[data-theme=dark]{--fg:#eaf4ff;--bg:#0d1524;--card:rgba(29,42,65,.7);--muted:#9eaec4}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--fg:#eaf4ff;--bg:#0d1524;--card:rgba(29,42,65,.7);--muted:#9eaec4}}
*{box-sizing:border-box}body{margin:0;padding:20px;min-width:250px}main{max-width:800px;margin:0 auto;padding:24px 0}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:650}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(140deg,#36d7d1,#7764f4);display:grid;place-items:center;color:white}.logo svg{width:24px}select,button{font:inherit;font-size:12px;border:1px solid #8396b52a;background:var(--card);color:var(--fg);border-radius:9px;padding:8px;cursor:pointer}h1{font-size:clamp(24px,4vw,38px);letter-spacing:-1px;margin:36px 0 10px}p{color:var(--muted);font-size:13px;margin:0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:28px}.card{isolation:isolate;position:relative;overflow:hidden;min-height:242px;padding:26px;border:1px solid #8396b52a;background:var(--card);border-radius:24px;box-shadow:0 16px 40px #3954760a}.label{font-size:13px;color:var(--muted)}.value{font-size:66px;line-height:1.2;font-weight:650;letter-spacing:-3px;margin:14px 0}.value small{font-size:21px;letter-spacing:0;margin-left:5px}.reset{font-size:12px;color:var(--muted);line-height:1.6}.water{position:absolute;z-index:-1;bottom:0;left:0;right:0;height:var(--level,0%);max-height:82%;background:linear-gradient(160deg,#33d6d32c,#5fa4f52b);transition:height 1.2s}.card:nth-child(2) .water{background:linear-gradient(160deg,#7d8cf52b,#ba74f330)}.water:before,.water:after{content:'';position:absolute;left:-50%;width:200%;height:28px;top:-15px;border-radius:48%;background:#5edbdf25;animation:wave 6s ease-in-out infinite alternate}.water:after{top:-10px;background:#8d9df01a;animation-delay:-3s;animation-duration:8s}@keyframes wave{to{transform:translateX(12%) rotate(3deg)}}footer{margin-top:24px;display:flex;justify-content:space-between;align-items:center;gap:16px}.meta{display:grid;gap:7px}#status{font-size:12px;color:#298e8a}#status.error{color:#d87866}#updated{font-size:11px;color:var(--muted)}@media(max-width:450px){main{padding:8px 0}.cards{gap:12px;grid-template-columns:1fr}.card{min-height:205px;padding:22px}h1{margin-top:26px}.value{font-size:56px}}@media(prefers-reduced-motion:reduce){.water:before,.water:after{animation:none}.water{transition:none}}
</style></head><body><main><header><div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8c4-6 8 6 12 0 1-2 3-2 4-1M4 15c4-6 8 6 12 0 1-2 3-2 4-1"/></svg></span>Codex Halo</div><select id="language" aria-label="Language / 语言"><option value="auto">Auto / 自动</option><option value="zh">中文</option><option value="en">English</option></select></header><h1 id="title"></h1><p id="sub"></p><div class="cards"><article class="card" id="pCard"><div class="water"></div><div class="label" id="primary"></div><div class="value"><span id="pValue">—</span><small>%</small></div><div class="reset" id="pReset"></div></article><article class="card" id="sCard"><div class="water"></div><div class="label" id="secondary"></div><div class="value"><span id="sValue">—</span><small>%</small></div><div class="reset" id="sReset"></div></article></div><footer><div class="meta"><span id="status" role="status"></span><span id="updated"></span></div><button id="refresh" type="button"></button></footer></main><script type="module">/*APP_SCRIPT*/</script></body></html>
