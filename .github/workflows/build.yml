name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Archive portable application
        shell: pwsh
        run: Compress-Archive -LiteralPath ../CodexHalo -DestinationPath CodexHalo-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CodexHalo-Windows-x64
          path: CodexHalo-Windows-x64.zip
